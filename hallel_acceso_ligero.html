<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#151b1c">
<title>Hallel Team Hub | Acceso privado</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#f8f7f2;color:#151b1c;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;max-width:410px;background:#fff;border:1px solid #d9ddd7;border-radius:20px;padding:30px;box-shadow:0 14px 35px #151b1c0a}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:26px}.icon{width:47px;height:47px;border-radius:12px;background:#151b1c;color:#c8f36b;display:grid;place-items:center;font-size:27px;font-weight:900}.name{font-size:20px;font-weight:900;letter-spacing:.2em}.sub{font-size:10px;letter-spacing:.15em;color:#31584d;font-weight:750}
h1{font-size:26px;letter-spacing:-.04em;margin:8px 0}p{font-size:13px;color:#596a62;line-height:1.6}.label{display:block;font-size:12px;font-weight:700;margin:18px 0 7px}
input{width:100%;padding:13px 14px;border:1px solid #d9ddd7;border-radius:10px;font:inherit;font-size:14px}input:focus-visible,button:focus-visible{outline:3px solid #c8f36b;outline-offset:2px}
button{cursor:pointer;border:0;border-radius:10px;font-weight:750;padding:13px 16px;font:inherit;font-size:13px}button:disabled{opacity:.6;cursor:wait}.primary{background:#c8f36b;width:100%;margin:22px 0 8px}.link{background:none;color:#31584d;text-decoration:underline;padding:8px 0}
#message{margin:16px 0;padding:12px;border-radius:12px;background:#e9f3df;color:#31584d;font-size:13px;white-space:pre-wrap}#message.error{background:#ffeae7;color:#9d3e32}.fine{font-size:11px;border-top:1px solid #e4e9e3;padding-top:16px;margin-top:22px}
[hidden]{display:none!important}
</style></head><body><main>
<div class="logo"><div class="icon">H</div><div><div class="name">HALLEL</div><div class="sub">TEAM HUB</div></div></div>
<section id="loginSection"><div class="sub">ACCESO PRIVADO</div><h1 id="formTitle">Iniciar sesión</h1><p id="formHint">Accede únicamente con una cuenta autorizada.</p>
<form id="loginForm"><label class="label" for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required>
<label class="label" for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" minlength="12" required>
<button id="submit" class="primary" type="submit">Ingresar</button></form>
<button class="link" type="button" id="switch">Crear mi cuenta</button></section>
<section id="accountSection" hidden><div class="sub">CUENTA CONECTADA</div><h1>Bienvenido a Hallel</h1><p id="accountEmail"></p><p id="accountRole"></p><button id="logout" type="button">Cerrar sesión</button></section>
<div id="message" role="status" aria-live="polite" hidden></div>
<p class="fine">Entorno de desarrollo. No subas información confidencial de clientes todavía.</p>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
(()=>{'use strict';
const url='https://lnzlbakqxbbtskkujlbp.supabase.co';
const key='sb_publishable_jkYY4MF51OJNFgkV0aP-GQ_XmYDgzCW';
const redirect='https://oscarbarruetam.github.io/hallel-media/hallel_acceso_ligero.html';
const $=id=>document.getElementById(id);
let signup=false;
function status(t,err=false){$('message').hidden=false;$('message').textContent=t;$('message').className=err?'error':''}
if(!window.supabase?.createClient){status('No se pudo cargar Supabase. Revisa tu conexión a Internet.',true);return}
const db=window.supabase.createClient(url,key,{auth:{persistSession:true,detectSessionInUrl:true}});
$('switch').onclick=()=>{signup=!signup;$('formTitle').textContent=signup?'Crear cuenta':'Iniciar sesión';$('formHint').textContent=signup?'Regístrate y confirma el mensaje que recibirás por correo.':'Accede únicamente con una cuenta autorizada.';$('submit').textContent=signup?'Registrarme':'Ingresar';$('switch').textContent=signup?'Ya tengo una cuenta':'Crear mi cuenta';$('password').autocomplete=signup?'new-password':'current-password';$('message').hidden=true};
$('loginForm').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{const email=$('email').value.trim().toLowerCase(),password=$('password').value;const r=signup?await db.auth.signUp({email,password,options:{emailRedirectTo:redirect}}):await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(signup){status(r.data.session?'Cuenta creada, pero la confirmación de correo podría estar desactivada. No se activarán permisos sin confirmación.':'Solicitud registrada. Revisa tu correo y confirma el enlace de Hallel.')}else await loadAccount()}catch(error){status(error.message||'No se pudo completar el acceso.',true)}finally{$('submit').disabled=false}};
async function loadAccount(){const u=await db.auth.getUser();if(u.error||!u.data.user)return;const user=u.data.user;const [p,b]=await Promise.all([db.from('platform_admins').select('user_id').eq('user_id',user.id),db.from('brands').select('id').is('archived_at',null)]);if(p.error||b.error){status('No se pudieron comprobar los permisos. Vuelve a intentar.',true);return}$('loginSection').hidden=true;$('accountSection').hidden=false;$('accountEmail').textContent=user.email||'';$('accountRole').textContent=p.data?.length?'Superadministrador Hallel':b.data?.length?'Cuenta activa con acceso de marca':'Cuenta verificada; falta asignar acceso'}
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
db.auth.getSession().then(r=>{if(r.data?.session)loadAccount()}).catch(e=>status(e.message,true));
})();
</script></body></html>
